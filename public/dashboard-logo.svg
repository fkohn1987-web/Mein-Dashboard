<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Persönliches Dashboard</title>
  <desc id="logo-description">Ein zentraler Orientierungspunkt mit vier verbundenen Verwaltungsmodulen.</desc>
  <defs>
    <linearGradient id="logo-bg" x1="12" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#223d5c"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="logo-core" x1="35" y1="31" x2="64" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#e5a83d"/>
    </linearGradient>
    <linearGradient id="logo-node" x1="18" y1="18" x2="78" y2="79" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bce4ff"/>
      <stop offset="1" stop-color="#74b4ed"/>
    </linearGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="3.5" y="3.5" width="89" height="89" rx="25" fill="url(#logo-bg)" stroke="#456889" stroke-opacity=".52"/>
  <path d="M26 35v-5c0-3.314 2.686-6 6-6h6M70 35v-5c0-3.314-2.686-6-6-6h-6M26 61v5c0 3.314 2.686 6 6 6h6M70 61v5c0 3.314-2.686 6-6 6h-6" fill="none" stroke="#6c9ac5" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>

  <g fill="none" stroke="url(#logo-node)" stroke-linecap="round" stroke-width="2.5">
    <path d="M48 31v9"/>
    <path d="M65 48h-9"/>
    <path d="M48 65v-9"/>
    <path d="M31 48h9"/>
  </g>

  <g fill="url(#logo-node)" stroke="#d6efff" stroke-opacity=".48" stroke-width="1.2">
    <rect x="39" y="14" width="18" height="17" rx="6"/>
    <rect x="65" y="39" width="17" height="18" rx="6"/>
    <rect x="39" y="65" width="18" height="17" rx="6"/>
    <rect x="14" y="39" width="17" height="18" rx="6"/>
  </g>

  <g fill="none" stroke="#173047" stroke-opacity=".64" stroke-width="1.7" stroke-linecap="round">
    <path d="M44 20h8M44 24h5"/>
    <path d="M71 44v8M75 44v5"/>
    <path d="M44 72h8M44 76h5"/>
    <path d="M20 44v8M24 44v5"/>
  </g>

  <g filter="url(#logo-glow)">
    <rect x="36" y="36" width="24" height="24" rx="8" fill="url(#logo-core)" stroke="#ffe6a6" stroke-opacity=".72" stroke-width="1.4" transform="rotate(45 48 48)"/>
    <circle cx="48" cy="48" r="5.2" fill="#132335" stroke="#fff1c5" stroke-opacity=".8" stroke-width="1.4"/>
    <path d="M48 39v5M57 48h-5M48 57v-5M39 48h5" stroke="#fff1c5" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
